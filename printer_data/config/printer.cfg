[respond]
[include chopper_tune.cfg]
######################################################################
##						Include config files	 					##
######################################################################

[include devices.cfg]													# Include device configuration
[include autotune_tmc.cfg]												# Include TMC Autotune configuration
[include motors_sync.cfg]												# Include motors sync configuration
[include resonance_testing.cfg]											# Include resonance testing configuration
[include auto_speed.cfg]


[include maintenance.cfg]
[include GCode/macros.cfg]	
[include mainsail.cfg]													# Include Mainsail configuration
#[include shell_command.cfg]											# Include GCode Shell Command configuration
#[include KAMP_Settings.cfg]											# Include KAMP configuration

######################################################################
##							Enable features							##
######################################################################

[virtual_sdcard]														# Virtual SD card
path: /home/salem/printer_data/gcodes    								# Path to the virtual SD card directory
on_error_gcode: CANCEL_PRINT            								# G-code to execute on error

#---------------------------------------------------------------------

[gcode_arcs]															# G-code arcs
resolution: 0.1                         								# Arc interpolation resolution, handles G2/G3 commands

#---------------------------------------------------------------------

[exclude_object]														# Exclude objects

######################################################################
##						Printer model definition					##
######################################################################

[printer]                             									# Printer configuration
kinematics: corexy                    									# Printer type  limited_
max_velocity: 1000                    									# Maximum X/Y-axis velocity
max_z_velocity: 15                    									# Maximum Z-axis velocity
max_accel: 20000
#max_x_accel: 10000														# Maximum Z-axis acceleration
#max_y_accel: 10000														# Maximum Z-axis acceleration
max_z_accel: 200                      									# Maximum Z-axis acceleration
minimum_cruise_ratio: 0.5             									# Cruise ratio
square_corner_velocity: 5            									# Square corner velocity

