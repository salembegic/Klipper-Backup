######################################################################
##							  RGB LEDs								##
######################################################################

[neopixel hotend]														# Hotend LEDs
pin: SB2209:gpio16            											# LED pin - RGB
chain_count: 3                											# Number of LEDs
color_order: GRBW             											# Color order

######################################################################
##							 LED effects							##
######################################################################

[led_effect logo_gradient]												# Logo LED effect
leds:																	# LED selection
    neopixel:hotend (1)
layers:																	# Colors selection
    gradient  0.1 1.0 top (0.0, 0.0, 1.0), (0.5, 0.0, 0.8), (1.0, 0.0, 0.0), (0.8, 0.0, 0.5)
frame_rate: 10															# Frame rate
autostart: true															# Autostart

#---------------------------------------------------------------------


[led_effect nozzle_light]												# Nozzle light LED effect
leds:																	# LED selection
    neopixel:hotend (2,3)
layers:																	# Colors selection
    heater 0.0 0.0 top (0.0, 0.0, 0.0, 1.0)
heater: extruder														# Connected heater
frame_rate: 10															# Frame rate
autostart: true															# Autostart