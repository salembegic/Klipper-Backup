######################################################################
##							  RGB LEDs								##
######################################################################

[neopixel hotend_rgb]													# Hotend LEDs
pin: SB2209:gpio16            											# LED pin - RGB
chain_count: 3                											# Number of LEDs
color_order: GRBW             											# Color order

######################################################################
##							 LED effects							##
######################################################################

[led_effect logo_gradient]
leds:
    neopixel:hotend_rgb (1)                                             # Targets ONLY the 1st LED
layers:
    gradient 0.3 1.0 top (0.0, 0.0, 1.0), (0.5, 0.0, 0.8), (1.0, 0.0, 0.5), (1.0, 0.0, 0.0)
frame_rate: 10
autostart: true

######################################################################
##           Nozzle LEDs - Motion Active (LEDs 2 & 3)               ##
######################################################################

[led_effect nozzle_motion]
leds:
    neopixel:hotend_rgb (2,3)                                           # Targets LEDs 2 and 3
layers:
    stepper 1 0 top (0.0, 0.0, 0.0, 1.0)                                # Pure white on GRBW
stepper: x, y, z                                                        # Activates on X, Y, or Z motion
frame_rate: 10
autostart: true