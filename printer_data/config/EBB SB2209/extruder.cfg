######################################################################
##								Extruder							##
######################################################################

[extruder]																# Extruder settings - E0
step_pin: SB2209:gpio18             									# Pulse pin
dir_pin: SB2209:gpio19               									# Direction pin
enable_pin: !SB2209:gpio17           									# Enable pin
microsteps: 32                       									# Microstep setting
gear_ratio: 5:1                    										# Gear ratio
rotation_distance: 22.6789511        									# Rotation distance
nozzle_diameter: 0.400               									# Nozzle diameter
filament_diameter: 1.750            	 								# Filament diameter
pressure_advance: 0.05               									# Pressure advance
pressure_advance_smooth_time: 0.040   									# Pressure advance smooth time

heater_pin: SB2209:gpio7             									# Heater pin - HE0
sensor_type: MAX31865                									# Sensor type
sensor_pin: SB2209:gpio9            	 								# Sensor pin

control: mpc															# Control method
heater_power: 65														# Heater power
cooling_fan: fan_generic fan0											# Cooling fan
filament_density: 1.26													# Filament density
filament_heat_capacity: 1.8												# Filament heat capacity
# block_heat_capacity = 11.9948
# sensor_responsiveness = 0.104934
# ambient_transfer = 0.0796237
# fan_ambient_transfer = 0.0796237, 0.105869, 0.105546, 0.106582, 0.108077, 0.107242, 0.105851, 0.106157, 0.107688, 0.105976, 0.106695
min_temp: 0                        										# Minimum temperature
max_temp: 300                        									# Maximum temperature
min_extrude_temp: 170                									# Minimum extrude temperature

spi_software_sclk_pin: SB2209:gpio10 									# SPI clock pin
spi_software_mosi_pin: SB2209:gpio8  									# SPI MOSI pin
spi_software_miso_pin: SB2209:gpio11 									# SPI MISO pin
rtd_nominal_r: 100                   									# RTD nominal resistance
rtd_reference_r: 430                 									# RTD reference resistance
rtd_num_of_wires: 2                  									# Number of wires for the RTD

#---------------------------------------------------------------------

[tmc2209 extruder]
uart_pin: SB2209:gpio20              									# UART communication pin
run_current: 0.8                    									# Running current
sense_resistor: 0.110													# Sense resistor
