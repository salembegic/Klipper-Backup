	######################################################################
##						Include config files	 					##
######################################################################

[include leveling.cfg]													# Include bed leveling config file

######################################################################
##							 Cartographer							##
######################################################################

[mcu cartographer]														# Cartographer MCU settings
canbus_uuid: f2fd53da9cdb												# Can UUID

#---------------------------------------------------------------------

[cartographer]															# Cartorapher settings
mcu: cartographer														# MCU selection
x_offset: 0                          									# Cartographer X offset
y_offset: 23															# Cartographer Y offset
travel_speed: 800														# The speed of travel moves
macro_prefix: CARTO														# Macro prefix

######################################################################
##						   Cartographer scan						##
######################################################################

[cartographer scan]														# Cartorapher scan settings
#mesh_max_corner_radius: auto											#   Maximum corner radius (mm) for scan mesh path arcs. Omit or set to 'auto' to derive the radius from point spacing and axis limits; 0 disables smoothing arcs; positive values cap the auto-computed radius.

######################################################################
##						   Cartographer touch						##
######################################################################

[cartographer touch]													# Cartorapher touch settings

######################################################################
##	                 Accelerometer configuration					##
######################################################################

[adxl345 carto]															# Cartorapher accelerometer configuration
cs_pin: cartographer:PA3												# Chip select pin
spi_bus: spi1															# SPI bus selection

######################################################################
##	                 	Temperature Monitoring						##
######################################################################

[cartographer coil]														# Cartorapher coil temperature
name: 'cartographer_coil'												# Coil temperature sensor name
min_temp: 0																# Coil minimum temperature
max_temp: 105															# Coil maximum temperature

#---------------------------------------------------------------------

[temperature_sensor cartographer]										# Cartorapher MCU temperature
sensor_type: temperature_mcu											# Sensor type
sensor_mcu: cartographer												# MCU selection
min_temp: 5																# MCU minimum temperature
max_temp: 105															# MCU maximum temperature
